# =====================================================================================
# LawCA — single-file install. This ONE file contains the whole app (see payload at the bottom).
# Put it at:  .github/workflows/lawca.yml   — nothing else is needed.
#
# First run: unpacks the app into your repo, fetches news, builds, publishes to GitHub Pages.
# After that: refreshes news every 3 hours automatically. No API key needed (RSS feeds are free).
# One-time setting:  Repo → Settings → Pages → Source = "GitHub Actions".
# Optional (costs money): add secret ANTHROPIC_API_KEY or OPENAI_API_KEY + variable LLM_PROVIDER.
# =====================================================================================
name: LawCA

on:
  push:
    paths: [".github/workflows/lawca.yml"]
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lawca
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app (first run only)
        run: |
          if [ ! -f package.json ]; then
            F=$(grep -l '^# ---LAWCA-PAYLOAD-BEGIN---$' .github/workflows/*.yml | head -1)
            echo "Unpacking app from $F"
            sed -n '/^# ---LAWCA-PAYLOAD-BEGIN---$/,/^# ---LAWCA-PAYLOAD-END---$/p' "$F" \
              | grep -v -- '---LAWCA-PAYLOAD' | sed 's/^# //' | base64 -d | tar xz
            ls
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch news (a failing source never fails the run)
        run: npm run pipeline:run
        continue-on-error: true
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MAX_ARTICLES_PER_RUN: ${{ vars.LLM_MAX_ARTICLES_PER_RUN || '15' }}

      - name: Freeze weekly / monthly quiz sets
        run: |
          [ "$(TZ=Asia/Kolkata date +%u)" = "7" ] && npm run generate:weekly || true
          [ "$(TZ=Asia/Kolkata date -d tomorrow +%d)" = "01" ] && npm run generate:monthly || true

      - name: Optional Supabase mirror (skips if secrets unset)
        run: npm run sync:supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Save app + data to the repo
        run: |
          git config user.name "lawca-bot"; git config user.email "lawca-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "LawCA: update data $(date -u +%FT%TZ)" && git pull --rebase && git push)

      - name: Tests (informational)
        run: npm test
        continue-on-error: true

      - name: Build static site
        run: |
          BP="${{ vars.BASE_PATH }}"
          if [ "$BP" = "none" ]; then BP=""; elif [ -z "$BP" ]; then BP="/${{ github.event.repository.name }}"; fi
          NEXT_PUBLIC_BASE_PATH="$BP" npm run build

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

